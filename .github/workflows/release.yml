# ═══════════════════════════════════════════════════════════════════════════════
# Release Workflow - Publish to npm
# ═══════════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'
      - '@whiteclaws/white-rabbit@*'
      - '@whiteclaws/mcp-white-rabbit@*'

permissions:
  contents: read
  id-token: write

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # Test before release
  # ═════════════════════════════════════════════════════════════════════════════
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ═════════════════════════════════════════════════════════════════════════════
  # Publish core package
  # ═════════════════════════════════════════════════════════════════════════════
  publish-core:
    name: Publish @whiteclaws/white-rabbit
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/@whiteclaws/white-rabbit@')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build
        working-directory: packages/white-rabbit

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/white-rabbit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ═════════════════════════════════════════════════════════════════════════════
  # Publish MCP package
  # ═════════════════════════════════════════════════════════════════════════════
  publish-mcp:
    name: Publish @whiteclaws/mcp-white-rabbit
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/@whiteclaws/mcp-white-rabbit@')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build
        working-directory: packages/mcp-white-rabbit

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/mcp-white-rabbit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ═════════════════════════════════════════════════════════════════════════════
  # Create GitHub Release
  # ═════════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [test, publish-core]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Get changes since last tag
          git log $(git describe --tags --abbrev=0 HEAD~1)..HEAD --oneline --pretty=format:"- %s" > CHANGELOG.txt
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.changelog.outputs.version }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            ```bash
            npm install -g @whiteclaws/white-rabbit
            ```
            
            ## Packages
            - `@whiteclaws/white-rabbit` - Core scanner
            - `@whiteclaws/mcp-white-rabbit` - MCP server
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.version, 'alpha') || contains(steps.changelog.outputs.version, 'beta') }}
