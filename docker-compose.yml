services:
  scanner:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/scanner
      - REDIS_URL=redis://redis:6379
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MIN_TVL_THRESHOLD=${MIN_TVL_THRESHOLD:-10000000}
      - SCAN_CHAINS=${SCAN_CHAINS:-ethereum,base,arbitrum}
      - ALERT_MIN_SEVERITY=${ALERT_MIN_SEVERITY:-medium}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./contracts:/app/contracts

  worker:
    build: .
    command: node dist/worker.js
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/scanner
      - REDIS_URL=redis://redis:6379
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./contracts:/app/contracts
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G

  slither:
    image: trailofbits/eth-security-toolbox
    volumes:
      - ./contracts:/share:ro
    profiles:
      - tools

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
